<aside>
  <nav class="c-nav border-r border-indigo-200/60 dark:border-zinc-800/60" [class.icon-only]="!expandSidebar">
    <div
      class="overflow-hidden h-dvh grid grid-rows-[auto_1fr_auto] bg-surface-secondary-light dark:bg-surface-secondary-dark transition-[width] duration-300 ease-in-out"
      [ngClass]="{
        'w-52 min-[1120px]:w-62.5': !isMobileOrTab && expandSidebar,
        'w-14 min-[520px]:w-18': showSidebar() && (!expandSidebar || isMobileOrTab),
        'w-0': isMobileOrTab && !showSidebar(),
        'justify-items-center': isMobileOrTab || !expandSidebar,
      }"
    >
      <!-- side bar header  -->
      <div
        class="py-2.5 w-full flex items-center justify-center bg-indigo-200/40 dark:bg-zinc-900/40 shadow-md z-10"
        [ngClass]="{ 'pl-2 justify-start': expandSidebar }"
      >
        <a routerLink="/dashboard" class="h-10 flex items-center justify-start gap-1 cursor-pointer w-max">
          <img
            ngSrc="assets/logo/world-tour.png"
            alt="Logo"
            class="h-8 w-10 aspect-square object-contain"
            height="32"
            width="40"
            priority
          />
          @if (expandSidebar) {
            <h1 class="text-xl font-medium text-slate-800 dark:text-slate-200">SunTrip CRM</h1>
          }
        </a>
      </div>
      <!-- side bar navigation menu  -->
      <div class="text-sm py-4 md:py-6 overflow-y-auto c-scrollbar-hidden" [class]="expandSidebar ? 'w-full' : 'w-min'">
        <p-menu [model]="menuItems">
          <ng-template pTemplate="item" let-item>
            <a
              pRipple
              class="p-menu-item-link"
              [routerLink]="item.routerLink"
              routerLinkActive="p-menu-item-link-active"
              [pTooltip]="!expandSidebar ? item.label : null"
              tooltipPosition="right"
              tooltipStyleClass="text-xs ml-2.5"
            >
              <!-- menu item icon  -->
              <span class="p-menu-item-icon" [class]="item.icon"></span>
              <!-- menu item label  -->
              @if (expandSidebar) {
                <span class="p-menu-item-label">{{ item.label | titlecase }}</span>
              }
            </a>
          </ng-template>
        </p-menu>
      </div>

      <!-- footer user details and action section -->
      <div
        class="text-sm py-4 w-full bg-indigo-200/40 dark:bg-zinc-900/40 border-t border-indigo-200/60 dark:border-zinc-800/60"
        [class]="expandSidebar ? 'pl-2 pr-1' : 'flex flex-col gap-2'"
      >
        <!-- descriptive user details section when sidebar is expanded  -->
        @if (expandSidebar) {
          <div class="flex items-center justify-start gap-2 mb-2">
            <div>
              <p-avatar label="UN" shape="circle" size="large" />
            </div>
            <div>
              <p-tag
                severity="success"
                [value]="user()?.role || 'role'"
                [rounded]="true"
                class="text-xs! font-medium! border bg-emerald-500"
              />
              <span class="block text-xs">{{ user()?.name || 'name' }}</span>
            </div>
          </div>
        }

        <!-- mini user details section with popover -->
        @if (!expandSidebar) {
          <!-- popover button when sidebar is not expanded  -->
          <div class="flex items-center justify-center">
            <p-button
              (onClick)="op.toggle($event)"
              severity="secondary"
              [rounded]="true"
              icon="pi pi-user"
              pTooltip="User"
              tooltipPosition="right"
              tooltipStyleClass="text-xs ml-4 -translate-y-[12px]"
              [pAutoFocus]="false"
              styleClass="bg-indigo-200! hover:bg-indigo-300/60! border-indigo-300! dark:bg-zinc-700! dark:border-zinc-600! dark:hover:bg-zinc-600!"
            />
            <!-- popover target when sidebar is not expanded  -->
            <p-popover #op dismissable>
              <div class="flex items-center justify-start gap-2">
                <div>
                  <p-avatar label="UN" shape="circle" size="large" />
                </div>
                <div>
                  <p-tag
                    severity="success"
                    [value]="user()?.role || 'role' | titlecase"
                    [rounded]="true"
                    class="text-xs! font-medium! border bg-emerald-500"
                  />
                  <span class="block text-xs">{{ user()?.name || 'name' | titlecase }}</span>
                </div>
              </div>
            </p-popover>
          </div>
        }

        <!-- logout action  -->
        @if (expandSidebar) {
          <p-button
            icon="pi pi-sign-out"
            label="Logout"
            [pAutoFocus]="false"
            styleClass="bg-indigo-200! border-none! text-zinc-800! hover:bg-indigo-200/70! dark:bg-zinc-700! 
            dark:hover:bg-zinc-700/70! dark:text-zinc-50!"
            fluid
            (onClick)="logout()"
          />
        } @else {
          <div class="flex items-center justify-center">
            <p-button
              icon="pi pi-sign-out"
              severity="primary"
              pTooltip="Logout"
              tooltipPosition="right"
              tooltipStyleClass="text-xs ml-2.5 sm:ml-4"
              [pAutoFocus]="false"
              (onClick)="logout()"
            />
          </div>
        }
      </div>
    </div>
  </nav>

  <!-- menu toggle button  -->
  <div class="hidden min-[720px]:block c-toggle-menu-btn-wrapper">
    <p-button
      [icon]="expandSidebar ? 'pi pi-caret-left' : 'pi pi-caret-right'"
      severity="secondary"
      styleClass="sidebar-toggle-btn"
      (onClick)="handleSidebarExpandOrCollapse()"
    />
  </div>
</aside>
