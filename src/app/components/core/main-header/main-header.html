<header
  class="flex items-center justify-between gap-8 py-3.5 px-2 min-[720px]:px-6 bg-surface-app-light dark:bg-surface-app-dark"
>
  <div>
    <h1 class="text-lg md:text-xl font-medium text-zinc-900 dark:text-zinc-100">{{ title | titlecase }}</h1>
    <p class="text-xs md:text-sm text-zinc-500 dark:text-zinc-400">{{ summary }}</p>
  </div>
  <div class="flex items-center justify-center gap-1 md:gap-3">
    <div>
      <!-- theme control btn  -->
      @if (themeMode === 'light') {
        <p-button
          icon="pi pi-moon"
          [rounded]="true"
          severity="secondary"
          [size]="isMobileOrTab ? 'small' : 'large'"
          (onClick)="setDark()"
          pTooltip="Enable Dark Mode"
          tooltipPosition="bottom"
          tooltipStyleClass="text-xs mt-3"
        />
      }
      @if (themeMode === 'dark') {
        <p-button
          icon="pi pi-sun"
          [rounded]="true"
          severity="secondary"
          [size]="isMobileOrTab ? 'small' : 'large'"
          (onClick)="setLight()"
          pTooltip="Enable Light Mode"
          tooltipPosition="bottom"
          tooltipStyleClass="text-xs mt-3"
        />
      }
    </div>
    <!-- notification control btn  -->
    <div>
      <p-overlaybadge severity="danger" [value]="isMobileOrTab ? null : 4" badgeSize="small">
        <p-button icon="pi pi-bell" [rounded]="true" severity="secondary" [size]="isMobileOrTab ? 'small' : 'large'" />
      </p-overlaybadge>
    </div>
  </div>
</header>
