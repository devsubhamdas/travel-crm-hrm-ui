<div
  class="h-dvh w-dvw grid grid-cols-[max-content_1fr] overflow-hidden bg-surface-app-light dark:bg-surface-app-dark"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)"
>
  <!-- Sidebar -->
  <div class="sticky top-0 h-dvh z-999">
    <app-main-sidebar [(showSidebar)]="showSidebar"></app-main-sidebar>
  </div>

  <!-- Main column -->
  <div class="flex flex-col min-h-0 min-w-0">
    <!-- Scroll container (ONLY ONE) -->
    <div
      #mainScrollableContent
      class="flex-1 overflow-y-auto min-h-0"
      [style.--main-header-height.px]="mainHeaderHeight"
    >
      <!-- Sticky stack -->
      <div
        class="sticky top-0 transition-all duration-300 ease-in-out z-50"
        [class]="showMainHeader ? 'translate-y-0 opacity-100' : '-translate-y-full opacity-0 pointer-events-none'"
      >
        <section>
          <app-main-header #mainHeader></app-main-header>
        </section>
      </div>

      <!-- Routed main page content -->
      <div class="text-sm px-2 min-[720px]:px-4 min-[960px]:px-6">
        <section>
          <router-outlet></router-outlet>
        </section>
      </div>
    </div>
  </div>
</div>
